services:
  influxdb:
    image: influxdb:2.7.12
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?Set INFLUXDB_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?Set INFLUXDB_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${PG_DB:?Set PG_DB in .env}
      POSTGRES_USER: ${PG_USER:?Set PG_USER in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/01_customers.sql:/docker-entrypoint-initdb.d/01_customers.sql:ro
      - ./sql/02_services.sql:/docker-entrypoint-initdb.d/02_services.sql:ro
      - ./sql/03_orders.sql:/docker-entrypoint-initdb.d/03_orders.sql:ro
      - ./sql/04_order_details.sql:/docker-entrypoint-initdb.d/04_order_details.sql:ro
      - ./sql/05_shipments.sql:/docker-entrypoint-initdb.d/05_shipments.sql:ro
      - ./sql/06_machines.sql:/docker-entrypoint-initdb.d/06_machines.sql:ro
      - ./sql/07_wash_runs.sql:/docker-entrypoint-initdb.d/07_wash_runs.sql:ro
      - ./sql/08_machine_readings.sql:/docker-entrypoint-initdb.d/08_machine_readings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongo:
    image: mongo:8.0.4
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  influxdb_data:
  influxdb_config:
  postgres_data:
  mongo_data:
